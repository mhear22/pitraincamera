[package]
name = "sound-guard-client"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "rustls-tls", "json"] }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
tempfile = "3"

[features]
default = []
